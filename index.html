<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tournées">
<meta name="theme-color" content="#F4F4F7">
<link rel="apple-touch-icon" href="icon.png">
<title>Tournées Orléans — Révision dispatch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F7; --card:#FFFFFF; --ink:#15131C; --grey:#6B7280; --grey-soft:#9AA0AE; --line:#EAEAEF;
  --violet:#6C4FA1; --green:#1FAA59; --green-soft:#E4F6EA; --red:#E23D34; --red-soft:#FCEAE8;
  --yellow:#C98A00; --yellow-soft:#FCF3D8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;touch-action:manipulation}
button,label{touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:inherit}
button{cursor:pointer}
button:active{transform:scale(.97);transition:transform .08s}

/* ---------- Layout shell ---------- */
header{padding:calc(14px + env(safe-area-inset-top)) 18px 10px;background:var(--bg)}
.hd-row{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:16px}
.brand .name{font-weight:800;font-size:19px;letter-spacing:-.01em}
.avatar-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;color:var(--grey);position:relative}
.avatar-btn svg{width:18px;height:18px}
.hd-sub{max-width:640px;margin:6px auto 0;font-size:12.5px;color:var(--grey);font-weight:500}

.acct-menu{position:fixed;top:calc(58px + env(safe-area-inset-top));right:16px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(20,15,40,.14);padding:6px;z-index:60;
  min-width:210px}
.acct-menu a,.acct-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:none;
  background:none;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink);text-align:left;text-decoration:none}
.acct-menu a:active,.acct-menu button:active{background:var(--bg)}
.acct-menu .hint{padding:8px 12px 4px;font-size:11px;color:var(--grey-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em}

/* ---------- Depot row ---------- */
.depot-row{display:flex;gap:14px;max-width:640px;margin:4px auto 6px;padding:6px 18px 4px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.depot-row::-webkit-scrollbar{display:none}
.depot-chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;
  opacity:.55}
.depot-chip.on{opacity:1}
.depot-chip .badge{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em;box-shadow:0 2px 6px rgba(20,15,40,.12)}
.depot-chip.on .badge{box-shadow:0 0 0 2.5px var(--card),0 0 0 4.5px var(--ink)}
.depot-chip .lbl-mask{width:60px;overflow:hidden}
.depot-chip .lbl{display:inline-block;font-size:10px;font-weight:700;color:var(--grey);white-space:nowrap;
  text-transform:uppercase;letter-spacing:.02em}
.depot-chip.on .lbl{color:var(--ink)}
.depot-chip .lbl.mq{animation:mq-scroll 3.6s ease-in-out infinite alternate}
@keyframes mq-scroll{from{transform:translateX(0)}to{transform:translateX(var(--mq-dist,0px))}}

/* ---------- Content ---------- */
.wrap{max-width:640px;margin:0 auto;padding:4px 18px calc(96px + env(safe-area-inset-bottom))}
h2.sec{font-weight:800;font-size:19px;letter-spacing:-.01em;margin:10px 0 12px}
.hint-text{font-size:12.5px;color:var(--grey);margin-bottom:14px;font-weight:500;line-height:1.45}
.alert-box{border-radius:12px;padding:12px 14px;font-size:12.5px;margin-bottom:14px;font-weight:500;line-height:1.45}
.wkbar{background:var(--ink);color:#fff;border-radius:14px;padding:13px 14px;font-size:12.5px;line-height:1.5;
  margin-bottom:14px}
.wkbar b{color:var(--yellow)}

/* ---------- Bottom nav ---------- */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 10px calc(8px + env(safe-area-inset-bottom));z-index:50;max-width:640px;margin:0 auto}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
  padding:8px 4px;color:var(--grey-soft);border-radius:12px}
.bottom-nav button svg{width:23px;height:23px}
.bottom-nav button span{font-size:10.5px;font-weight:700;letter-spacing:.01em}
.bottom-nav button.on{color:var(--ink)}

/* ---------- Cards / generic ---------- */
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(20,15,40,.04),0 6px 18px rgba(20,15,40,.05)}

/* Search */
.search input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);font-size:16px;
  font-family:'Inter',sans-serif;background:var(--card)}
.hit{background:var(--card);border-radius:14px;box-shadow:0 1px 2px rgba(20,15,40,.04),0 4px 14px rgba(20,15,40,.05);
  padding:12px 14px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hit .cl{font-weight:700;font-size:14px}
.hit .loc{font-size:11.5px;color:var(--grey);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-top:1px}
.empty{color:var(--grey);font-size:14px;text-align:center;padding:26px 10px;font-weight:500}
.chip{display:inline-block;font-weight:800;font-size:12.5px;letter-spacing:.02em;color:#fff;padding:4px 10px;
  border-radius:20px;vertical-align:middle}
.linkbtn{background:none;border:none;color:var(--violet);font-weight:700;font-size:12.5px;text-decoration:underline}

/* Scan */
.scan-btn{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:34px 20px;border-radius:18px;
  border:1.5px dashed var(--grey-soft);background:var(--card);color:var(--ink);font-weight:800;font-size:16px;text-align:center}
.scan-btn svg{width:30px;height:30px;color:var(--grey)}
.scan-btn small{display:block;font-weight:500;font-size:12.5px;color:var(--grey)}
.preview{width:100%;max-height:220px;object-fit:contain;border-radius:14px;border:1px solid var(--line);margin-top:12px;background:#fff}
.loading{text-align:center;padding:26px 10px;color:var(--grey);font-weight:600;font-size:14px}
.spin{display:inline-block;width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;
  animation:sp .8s linear infinite;margin-bottom:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.verdict{margin-top:14px;background:var(--card);border-radius:18px;overflow:hidden;
  box-shadow:0 1px 2px rgba(20,15,40,.04),0 8px 24px rgba(20,15,40,.07)}
.verdict .v-tour{color:#fff;text-align:center;padding:22px 10px;font-weight:800;font-size:40px;letter-spacing:-.01em;line-height:1}
.verdict .v-tour small{display:block;font-size:14px;font-weight:600;letter-spacing:.02em;opacity:.92;margin-top:3px}
.verdict .v-body{padding:15px}
.verdict .v-row{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.verdict .v-row:last-child{border:none}
.verdict .v-row b{display:inline-block;min-width:86px;color:var(--grey);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.conf{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.conf.haute{background:var(--green-soft);color:#116836}.conf.moyenne{background:var(--yellow-soft);color:#6A5410}.conf.basse{background:var(--red-soft);color:#8F241C}

/* Tournées tab */
.tour-list{display:flex;flex-direction:column;gap:9px}
.tour-card{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:16px;padding:14px 15px;
  box-shadow:0 1px 2px rgba(20,15,40,.04),0 4px 14px rgba(20,15,40,.05);text-align:left}
.tour-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.tour-card-main{flex:1;min-width:0}
.tour-card-id{display:block;font-weight:800;font-size:15px}
.tour-card-meta{display:block;font-size:11.5px;color:var(--grey);font-weight:500;margin-top:1px}
.tour-card-count{font-size:11.5px;color:var(--grey-soft);font-weight:700;white-space:nowrap}
.back-btn{background:none;border:none;color:var(--grey);font-weight:700;font-size:13px;padding:4px 0 12px;display:flex;align-items:center;gap:4px}
.tour-head-card{background:var(--card);border-radius:16px;padding:18px;text-align:center;margin-bottom:14px;
  border:1.5px solid var(--line);box-shadow:0 1px 2px rgba(20,15,40,.04),0 4px 14px rgba(20,15,40,.05)}
.tour-head-id{font-weight:800;font-size:28px;letter-spacing:-.01em}
.tour-head-days{font-size:12px;color:var(--grey);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-top:3px}
.commune-block{background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden;
  box-shadow:0 1px 2px rgba(20,15,40,.04),0 4px 14px rgba(20,15,40,.05)}
.commune-title{background:var(--ink);color:#fff;font-weight:700;font-size:13.5px;letter-spacing:.02em;padding:10px 14px}
.client-list .client-row{padding:9px 14px;font-size:14px;font-weight:500;border-bottom:1px solid var(--line)}
.client-list .client-row:last-child{border-bottom:none}

/* Écran PIN */
#lock{position:fixed;inset:0;background:var(--ink);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#lock h2{font-weight:800;font-size:24px;color:#fff;letter-spacing:-.01em}
#lock p{color:rgba(255,255,255,.6);font-size:13px;font-weight:500}
.dots{display:flex;gap:14px;margin:6px 0}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:transparent}
.dot.full{background:#fff;border-color:#fff}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:12px}
.pad button{height:70px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);
  color:#fff;font-size:24px;font-weight:600}
.pad button:active{background:rgba(255,255,255,.18)}
#lock.shake .dots{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
</style>
</head>
<body>
<div id="lock">
  <h2>Tournées</h2>
  <p>Entre ton code</p>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="pad">
    <button onclick="pin(1)">1</button><button onclick="pin(2)">2</button><button onclick="pin(3)">3</button>
    <button onclick="pin(4)">4</button><button onclick="pin(5)">5</button><button onclick="pin(6)">6</button>
    <button onclick="pin(7)">7</button><button onclick="pin(8)">8</button><button onclick="pin(9)">9</button>
    <span></span><button onclick="pin(0)">0</button><button onclick="pin(-1)">⌫</button>
  </div>
</div>

<header><div class="hd-row">
  <div class="brand"><span class="mark">T</span><span class="name">Tournées</span></div>
  <button class="avatar-btn" id="acctBtn" onclick="toggleAcctMenu(event)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.3"/><path d="M5 20c1-3.8 4-5.8 7-5.8s6 2 7 5.8"/></svg>
  </button>
</div>
<div class="hd-sub" id="hdSub">Dispatch colis · communes &amp; clients</div>
</header>
<div id="acctMenu" class="acct-menu" hidden>
  <div class="hint">Compte</div>
  <a href="admin.html" target="_blank" rel="noopener">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 8l4 4-4 4"/><path d="M14 12H3"/></svg>
    Connexion manager
  </a>
  <button onclick="relock()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    Verrouiller l'app
  </button>
</div>

<div id="depotNav" class="depot-row"></div>
<div class="wrap" id="app"></div>
<nav id="nav" class="bottom-nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {getFirestore, collection, query, orderBy, getDocs, runTransaction, doc} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import {getAuth, signInAnonymously} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

/* ============ FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDoALR1ARhahY07JjR-yvDsgsqKixBI8x8",
  authDomain: "tournee-tcs.firebaseapp.com",
  projectId: "tournee-tcs",
  storageBucket: "tournee-tcs.firebasestorage.app",
  messagingSenderId: "570813011756",
  appId: "1:570813011756:web:63c19812f04eebc9333e89"
};
const fbApp = initializeApp(firebaseConfig);
const fbDb = getFirestore(fbApp);
const fbAuth = getAuth(fbApp);

/* ============ VERROU PIN ============ */
const PIN_HASH="aa82088246685c17ebf16d48877686b831ed384ffdc42e76494283c271704d7a";
let pinBuf="";
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function unlockOK(){document.getElementById('lock').style.display='none';try{localStorage.setItem('unlocked','1');}catch(e){}}
try{if(localStorage.getItem('unlocked')==='1')document.addEventListener('DOMContentLoaded',unlockOK);}catch(e){}
window.pin=async n=>{
  if(n===-1)pinBuf=pinBuf.slice(0,-1);
  else if(pinBuf.length<4)pinBuf+=String(n);
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('full',i<pinBuf.length));
  if(pinBuf.length===4){
    if(await sha(pinBuf)===PIN_HASH){unlockOK();}
    else{
      const L=document.getElementById('lock');L.classList.add('shake');
      if(navigator.vibrate)navigator.vibrate(120);
      setTimeout(()=>{L.classList.remove('shake');pinBuf="";
        document.querySelectorAll('.dot').forEach(d=>d.classList.remove('full'));},380);
    }
  }
};
window.relock=()=>{
  try{localStorage.removeItem('unlocked');}catch(e){}
  document.getElementById('lock').style.display='flex';
  pinBuf='';document.querySelectorAll('.dot').forEach(d=>d.classList.remove('full'));
  hideAcctMenu();
};

/* ============ COMPTE (menu) ============ */
window.toggleAcctMenu=e=>{
  e.stopPropagation();
  const m=document.getElementById('acctMenu');
  m.hidden=!m.hidden;
};
function hideAcctMenu(){document.getElementById('acctMenu').hidden=true;}
document.addEventListener('click',e=>{
  const m=document.getElementById('acctMenu'), btn=document.getElementById('acctBtn');
  if(!m.hidden && !m.contains(e.target) && e.target!==btn && !btn.contains(e.target))hideAcctMenu();
});

/* ============ DONNÉES ============ */
let DEPOTS = [];
function normalizeDepots(depots){
  // tolère l'ancien format (cl: string[]) en plus du nouveau (cl: {nom,alias}[]) — que la source
  // soit Firestore, le cache local ou le data.json embarqué.
  (depots||[]).forEach(d=>(d.tournees||[]).forEach(t=>(t.communes||[]).forEach(c=>{
    c.cl=(c.cl||[]).map(cl=>typeof cl==='string'?{nom:cl,alias:[]}:{nom:cl.nom,alias:cl.alias||[]});
  })));
  return depots;
}
async function loadFromFirestore(){
  const depotsSnap = await getDocs(query(collection(fbDb,'depots'), orderBy('order')));
  const depots = [];
  for(const depotDoc of depotsSnap.docs){
    const tSnap = await getDocs(query(collection(fbDb,'depots',depotDoc.id,'tournees'), orderBy('order')));
    const tournees = tSnap.docs.map(td=>({id:td.id, ...td.data()}));
    depots.push({id:depotDoc.id, label:depotDoc.data().label||depotDoc.id, tournees});
  }
  return depots;
}
async function loadData(){
  try{
    await signInAnonymously(fbAuth).catch(()=>{});
    const depots = await loadFromFirestore();
    if(!depots.length)throw new Error('base vide');
    DEPOTS = normalizeDepots(depots);
    try{localStorage.setItem('depotsCache', JSON.stringify(DEPOTS));}catch(e){}
  }catch(e){
    console.warn('Firestore indisponible, secours local', e);
    let cached=null;
    try{cached=JSON.parse(localStorage.getItem('depotsCache')||'null');}catch(e2){}
    if(cached&&cached.length){DEPOTS=normalizeDepots(cached);}
    else{
      const res=await fetch('data/data.json');
      if(!res.ok)throw new Error('HTTP '+res.status);
      const json=await res.json();
      DEPOTS=normalizeDepots(json.depots);
    }
  }
}

/* ============ ÉTAT ============ */
const app=document.getElementById('app'), nav=document.getElementById('nav'), depotNav=document.getElementById('depotNav');
let mode='scan', selDepot='ORLEANS', tourView='list', selTourId=null;
const DEPOT_COLORS=['#6C4FA1','#D5342B','#2F8F5B','#3E6FB5','#C29A00','#B03060','#1F8A8C','#574083'];
function curDepot(){return DEPOTS.find(d=>d.id===selDepot)||DEPOTS[0];}
function curT(){return curDepot().tournees;}
function applyDepotMarquee(){
  depotNav.querySelectorAll('.lbl').forEach(el=>{
    el.classList.remove('mq');
    const mask=el.parentElement;
    const overflow=el.scrollWidth-mask.clientWidth;
    if(overflow>1){
      el.style.setProperty('--mq-dist',(-overflow-2)+'px');
      el.classList.add('mq');
    }
  });
}
function renderDepotNav(){
  depotNav.innerHTML=DEPOTS.map((d,i)=>`<button class="depot-chip ${d.id===selDepot?'on':''}" onclick="pickDepot('${d.id}')">
    <span class="badge" style="background:${DEPOT_COLORS[i%DEPOT_COLORS.length]}">${esc(d.id.slice(0,2))}</span>
    <span class="lbl-mask"><span class="lbl">${esc(d.label)}</span></span>
  </button>`).join('');
  const sub=document.getElementById('hdSub');
  if(sub)sub.textContent=`${curDepot().label} · ${curT().length} tournée${curT().length>1?'s':''}`;
  // texte qui ne rentre pas dans le badge : on le fait défiler plutôt que de le couper avec "…"
  applyDepotMarquee();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(applyDepotMarquee);
}
window.pickDepot=id=>{
  if(id===selDepot)return;
  selDepot=id; tourView='list'; selTourId=null;
  rebuildIndex();
  renderDepotNav();
  render();
  window.scrollTo({top:0});
};

const ICONS={
  scan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.2"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.5-4.5"/></svg>',
  tours:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="6" height="6" rx="1.3"/><rect x="14.5" y="4.5" width="6" height="6" rx="1.3"/><rect x="3.5" y="14.5" width="6" height="6" rx="1.3"/><rect x="14.5" y="14.5" width="6" height="6" rx="1.3"/></svg>'
};
const MODES=[['scan','Scan'],['search','Recherche'],['tours','Tournées']];
function renderNav(){nav.innerHTML=MODES.map(([k,l])=>`<button class="${mode===k?'on':''}" onclick="setMode('${k}')">${ICONS[k]}<span>${l}</span></button>`).join('');}
function setMode(m){mode=m;renderNav();render();}
window.setMode=setMode;

function chip(t){return `<span class="chip" style="background:${t.c}">${t.id}</span>`;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

/* ============ MODE WEEK-END (détection auto vendredi soir → samedi) ============ */
function inWeekendWindow(){
  const d=new Date(),day=d.getDay(),hour=d.getHours();
  return (day===5&&hour>=18)||day===6;
}
function weekendBannerHTML(){
  if(!inWeekendWindow())return '';
  const sat=new Date().getDay()===6;
  const msg=sat
    ?"Semaine clôturée : toutes les tournées (M et VM) sont terminées. Reprise et mise à jour des tournées lundi matin."
    :"Les tournées <b>M</b> (4501M→4505M, Pithiviers) sont terminées depuis jeudi soir. Seule <b>4507VM</b> (centre-ville) roule encore ce soir.";

}

window.doSearch=v=>{
  const box=document.getElementById('hits');
  const s=v.trim().toLowerCase();
  if(s.length<2){box.innerHTML='<div class="empty">Tape au moins 2 lettres (client ou commune).</div>';return;}
  const hits=[];
  curT().forEach(t=>t.communes.forEach(c=>{
    if(c.n.toLowerCase().includes(s))hits.push({t,c,cl:'— toute la commune —'});
    c.cl.forEach(x=>{if(x.nom.toLowerCase().includes(s))hits.push({t,c,cl:x.nom});});
  }));
  box.innerHTML=hits.length?hits.slice(0,40).map(h=>`<div class="hit">
    <div><div class="cl">${esc(h.cl)}</div><div class="loc">${esc(h.c.n)}</div></div>${chip(h.t)}
  </div>`).join(''):'<div class="empty">Aucun résultat — vérifie l\'orthographe.</div>';
};
function renderSearch(){
  app.innerHTML=`<h2 class="sec">Où va ce colis ?</h2>
  <p class="hint-text">Ultra utile au taf : tape le nom du client sur l'étiquette → commune + tournée directement.</p>

  <div id="hits"><div class="empty">Tape au moins 2 lettres (client ou commune).</div></div>`;
}

/* ============ SCAN ÉTIQUETTE (OCR local, open-source Tesseract.js — pas de clé API, pas de photo envoyée à un serveur) ============ */
function renderScan(){
  app.innerHTML=`<h2 class="sec">Scanner une étiquette</h2>
  <p class="hint-text">Cadre bien le <b>nom du destinataire</b> (+ la ville si visible).</p>
  <label class="scan-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.2"/></svg>
    Prendre l'étiquette en photo
    <small>ou choisir une photo existante</small>
    <input type="file" accept="image/*" capture="environment" style="display:none" onchange="scanImg(this)">
  </label>
  <div id="scan-out"></div>`;
}
window.scanImg=async inp=>{
  const f=inp.files&&inp.files[0];if(!f)return;
  const out=document.getElementById('scan-out');
  const url=URL.createObjectURL(f);
  out.innerHTML=`<img class="preview" src="${url}"><div class="loading"><span class="spin"></span><br><span id="scan-progress">Lecture de l'étiquette…</span></div>`;
  try{
    const text=await runOCR(f);
    const res=matchEntry(text);
    showVerdict(res,url);
  }catch(e){
    out.innerHTML=`<img class="preview" src="${url}"><div class="alert-box" style="margin-top:12px;background:var(--red-soft);color:#8F241C">
      Échec de la lecture (${esc(String(e.message||e))}). Réessaie avec une photo plus nette et bien cadrée, ou tape le nom du client dans l'onglet Recherche.</div>`;
  }
  inp.value='';
};
const OCR_STATUS_FR={'loading tesseract core':'Chargement du moteur OCR','initializing tesseract':'Initialisation',
  'loading language traineddata':'Téléchargement du modèle FR','initializing api':'Préparation','recognizing text':'Lecture du texte'};
async function runOCR(file){
  if(typeof Tesseract==='undefined')throw new Error('moteur OCR indisponible (hors-ligne au premier lancement ?)');
  const {data}=await Tesseract.recognize(file,'fra',{
    logger:m=>{
      const el=document.getElementById('scan-progress');
      if(el&&m.status&&typeof m.progress==='number')
        el.textContent=`${OCR_STATUS_FR[m.status]||'Analyse'}… ${Math.round(m.progress*100)}%`;
    }
  });
  return data.text||'';
}
function normTxt(s){
  return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
}
function stripParens(s){return (s||'').replace(/\([^)]*\)/g,' ');}
function levenshtein(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  return dp[m][n];
}
function wordSim(a,b){if(!a.length||!b.length)return 0;return 1-levenshtein(a,b)/Math.max(a.length,b.length);}
function flatEntries(){
  const arr=[];
  curT().forEach(t=>t.communes.forEach(c=>{
    arr.push({label:c.n,type:'commune',t,c});
    c.cl.forEach(cl=>arr.push({label:cl.nom,alias:cl.alias||[],type:'client',t,c,client:cl}));
  }));
  return arr;
}
let ENTRIES=[], COMMUNE_TOURS={};
function rebuildIndex(){
  ENTRIES=flatEntries();
  COMMUNE_TOURS={};
  curT().forEach(t=>t.communes.forEach(c=>{(COMMUNE_TOURS[c.n]=COMMUNE_TOURS[c.n]||new Set()).add(t.id);}));
}
function communeAmbiguous(name){return (COMMUNE_TOURS[name]&&COMMUNE_TOURS[name].size)>1;}
function scoreLabel(labelWords,ocrWords){
  let weightSum=0,matchSum=0;
  labelWords.forEach(w=>{
    if(w.length<2)return;
    let best=0;
    for(const ow of ocrWords){const s=wordSim(w,ow);if(s>best)best=s;}
    weightSum+=w.length;matchSum+=w.length*best;
  });
  return {score:weightSum?matchSum/weightSum:0,weight:weightSum};
}
function scoreEntries(list,ocrWords){
  // en cas de score identique, on privilégie l'étiquette la plus longue/spécifique (plus d'évidence qu'un simple sigle générique)
  // les suffixes entre parenthèses ("(28)", "(centre-ville)"...) sont des repères internes à la base,
  // pas du texte qui apparaît tel quel sur une étiquette réelle : on les ignore pour le score.
  // on score aussi contre les alias appris (corrections précédentes) et on garde le meilleur score.
  return list.map(e=>{
    let best={score:0,weight:0};
    [e.label,...(e.alias||[])].forEach(variant=>{
      const r=scoreLabel(normTxt(stripParens(variant)).split(' '),ocrWords);
      if(r.score>best.score)best=r;
    });
    return {e,score:best.score,weight:best.weight};
  }).sort((a,b)=>(b.score-a.score)||(b.weight-a.weight));
}
function matchEntry(rawText){
  const lu=rawText.replace(/\s+/g,' ').trim().slice(0,140);
  const ocrWords=normTxt(rawText).split(' ').filter(w=>w.length>1);
  if(!ocrWords.length)
    return {lu,client:null,commune:null,tournee:null,confiance:'basse',alternatives:[],note:"Aucun texte détecté, reprends la photo bien cadrée sur l'étiquette."};
  const communes=scoreEntries(ENTRIES.filter(e=>e.type==='commune'),ocrWords);
  const clients=scoreEntries(ENTRIES.filter(e=>e.type==='client'),ocrWords);
  const bestCommune=communes[0], bestClient=clients[0];
  if((!bestCommune||bestCommune.score<0.45)&&(!bestClient||bestClient.score<0.45))
    return {lu,client:null,commune:null,tournee:null,confiance:'basse',alternatives:[],note:"Aucune correspondance fiable trouvée dans la base."};

  // Réflexe métier : une commune explicite et fiable (non ambiguë entre tournées) fait autorité,
  // le client sert juste à préciser. Si la commune est un piège (ex: Orléans, présent sur plusieurs
  // tournées) ou peu fiable, c'est le client qui tranche à la place.
  const communeReliable=bestCommune&&bestCommune.score>0.72&&!communeAmbiguous(bestCommune.e.c.n);
  let communeName,tournee,client,score,alt=[];
  if(communeReliable){
    communeName=bestCommune.e.c.n;tournee=bestCommune.e.t.id;score=bestCommune.score;
    // pour retrouver le client, on ignore les mots déjà "consommés" par le nom de la commune
    // (sinon un client du type "Dr Mos Gien" matcherait juste parce que "Gien" est déjà reconnu)
    const communeWords=new Set(normTxt(stripParens(communeName)).split(' '));
    const remaining=ocrWords.filter(w=>!communeWords.has(w));
    const localCandidates=ENTRIES.filter(e=>e.type==='client'&&e.c.n===communeName);
    const localScored=remaining.length?scoreEntries(localCandidates,remaining):[];
    client=localScored[0]&&localScored[0].score>0.5?localScored[0].e.label:null;
    alt=communes.slice(1).filter(s=>s.e.c.n!==communeName&&s.score>bestCommune.score-0.25).slice(0,3)
      .map(s=>`${s.e.t.id} · ${s.e.c.n}`);
  }else{
    const pick=bestClient&&bestClient.score>=0.45?bestClient:bestCommune;
    communeName=pick.e.c.n;tournee=pick.e.t.id;score=pick.score;
    client=pick.e.type==='client'?pick.e.label:null;
    alt=clients.concat(communes).filter(s=>s.e.c.n!==communeName&&s.score>=pick.score-0.2)
      .sort((a,b)=>b.score-a.score).slice(0,3).map(s=>`${s.e.t.id} · ${s.e.c.n}`);
  }
  const confiance=score>0.82?'haute':score>0.6?'moyenne':'basse';
  const note=communeName.startsWith('ORLÉANS')?"« Orléans » existe sur plusieurs tournées : vérifie le nom du client ci-dessus."
    :alt.length?"Plusieurs correspondances possibles, vérifie la ville sur l'étiquette.":'';
  return {lu,client,commune:communeName,tournee,confiance,alternatives:alt,note};
}
let lastRawText='';
function showVerdict(v,url){
  lastRawText=v.lu||'';
  const out=document.getElementById('scan-out');
  const t=curT().find(x=>x.id===v.tournee);
  if(!t){
    out.innerHTML=`<img class="preview" src="${url}">
    <div class="verdict"><div class="v-tour" style="background:var(--grey-soft)">INTROUVABLE<small>pas de correspondance</small></div>
    <div class="v-body">
      <div class="v-row"><b>Lu</b> ${esc(v.lu||'—')}</div>
      <div class="v-row"><b>Note</b> ${esc(v.note||'Vérifie manuellement dans Recherche.')}</div>
    </div></div>
    <button class="linkbtn" style="margin-top:10px" onclick="openCorrect()">❌ Corriger — c'est un client connu</button>`;
    return;
  }
  out.innerHTML=`<img class="preview" src="${url}">
  <div class="verdict">
    <div class="v-tour" style="background:${t.c}">${t.id}<small>${esc(v.commune||'')}</small></div>
    <div class="v-body">
      <div class="v-row"><b>Client</b> ${esc(v.client||'—')}</div>
      <div class="v-row"><b>Lu</b> ${esc(v.lu||'—')}</div>
      <div class="v-row"><b>Confiance</b> <span class="conf ${v.confiance||'moyenne'}">${esc(v.confiance||'moyenne')}</span></div>
      ${v.alternatives&&v.alternatives.length?`<div class="v-row"><b>Sinon</b> ${v.alternatives.map(esc).join(' · ')}</div>`:''}
      ${v.note?`<div class="v-row"><b>Note</b> ${esc(v.note)}</div>`:''}
    </div>
  </div>
  <button class="linkbtn" style="margin-top:10px" onclick="openCorrect()">❌ Ce n'est pas le bon client — corriger</button>`;
}

/* ============ CORRECTION (apprentissage) ============ */
window.openCorrect=function(){
  const rawText=lastRawText;
  const out=document.getElementById('scan-out');
  if(document.getElementById('corrBox'))document.getElementById('corrBox').remove();
  const box=document.createElement('div');
  box.className='verdict';
  box.id='corrBox';
  box.style.marginTop='12px';
  box.innerHTML=`<div class="v-body">
    <div class="v-row" style="border:none;padding-bottom:4px"><b>Corriger vers</b></div>
    <input id="corrInput" placeholder="Tape le vrai nom du client…" style="width:100%;padding:11px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;margin-bottom:8px">
    <div id="corrHits"></div>
  </div>`;
  out.appendChild(box);
  document.getElementById('corrInput').focus();
  document.getElementById('corrInput').addEventListener('input',e=>{
    const s=e.target.value.trim().toLowerCase();
    const hitsEl=document.getElementById('corrHits');
    if(s.length<2){hitsEl.innerHTML='';return;}
    const hits=ENTRIES.filter(en=>en.type==='client'&&en.label.toLowerCase().includes(s)).slice(0,15);
    hitsEl.innerHTML=hits.length?hits.map((h,i)=>`<div class="hit" style="cursor:pointer" data-i="${i}"><div><div class="cl">${esc(h.label)}</div><div class="loc">${esc(h.c.n)}</div></div>${chip(h.t)}</div>`).join(''):'<div class="empty">Aucun résultat.</div>';
    hitsEl.querySelectorAll('.hit').forEach((el,i)=>el.onclick=()=>confirmCorrect(hits[i],rawText));
  });
};
async function confirmCorrect(entry,rawText){
  const box=document.getElementById('corrBox');
  box.innerHTML='<div class="loading"><span class="spin"></span><br>Enregistrement…</div>';
  try{
    await saveAlias(entry,rawText);
    const img=document.querySelector('#scan-out .preview');
    showVerdict({lu:rawText,client:entry.client.nom,commune:entry.c.n,tournee:entry.t.id,confiance:'haute',alternatives:[],
      note:"Corrigé — l'app reconnaîtra directement ce client la prochaine fois."}, img?img.src:'');
  }catch(e){
    box.innerHTML=`<div class="v-body"><div class="v-row" style="color:var(--red)">Échec de l'enregistrement : ${esc(String(e.message||e))}</div></div>`;
  }
}
async function saveAlias(entry,rawText){
  const alias=rawText.replace(/\s+/g,' ').trim().slice(0,140);
  if(!alias)return;
  const tRef=doc(fbDb,'depots',selDepot,'tournees',entry.t.id);
  await runTransaction(fbDb, async(tx)=>{
    const snap=await tx.get(tRef);
    if(!snap.exists())throw new Error('tournée introuvable côté base');
    const data=snap.data();
    const communes=(data.communes||[]).map(c=>({...c,cl:(c.cl||[]).map(cl=>({...cl}))}));
    const ci=communes.findIndex(c=>c.n===entry.c.n);
    if(ci===-1)throw new Error('commune introuvable côté base');
    const li=communes[ci].cl.findIndex(cl=>cl.nom===entry.client.nom);
    if(li===-1)throw new Error('client introuvable côté base');
    const curAlias=communes[ci].cl[li].alias||[];
    if(!curAlias.includes(alias))communes[ci].cl[li].alias=[...curAlias,alias];
    tx.update(tRef,{communes});
  });
  entry.client.alias=entry.client.alias||[];
  if(!entry.client.alias.includes(alias))entry.client.alias.push(alias);
  try{localStorage.setItem('depotsCache', JSON.stringify(DEPOTS));}catch(e){}
}

function render(){
  if(mode==='scan')renderScan();
  else if(mode==='tours')renderTournees();
  else renderSearch();
  const b=weekendBannerHTML();
  if(b)app.insertAdjacentHTML('afterbegin',b);
}
loadData().then(()=>{
  rebuildIndex();
  renderDepotNav();
  renderNav();render();
}).catch(e=>{
  app.innerHTML=`<div class="alert-box" style="background:var(--red-soft);color:#8F241C">
    Impossible de charger la base (data/data.json). ${esc(String(e.message||e))}</div>`;
});
</script>
